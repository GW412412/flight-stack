# LLM-behind-the-sticks profile: the real Pixhawk 1 (ArduCopter).
# START HERE ON HARDWARE:  props OFF, actuation_enabled = false, dry_run = true.
# Then: dry_run = false with props off (bench), then props on in the paddock,
# always with G on the radio. See docs/LLM-STACK.md "Hardware bring-up".
profile = "pixhawk"

[mavlink]
url = "udpin:127.0.0.1:14560"   # MAVProxy owns /dev/ttyACM0 and forwards here
send_heartbeat = true           # sysid 250 -> does NOT feed the GCS failsafe
request_streams = false

[safety]
actuation_enabled = false       # read-only until you deliberately flip it
dry_run = true                  # gate runs, nothing transmitted
confirm_mode = "operator"       # code shown on the console, not to the LLM
# PLACEHOLDER (not measured): seconds a confirmation code stays valid. The
# operator has to read the code off the console and type it; 45 s allows for
# that without leaving an approval lying around. Max 120 (start-up refuses more).
confirm_ttl_s = 45
max_alt_m = 20.0
min_goto_alt_m = 2.0
geofence_radius_m = 60.0        # stay well inside line of sight
max_speed_ms = 3.0
require_rc_link = true          # G's radio must be up to arm
require_gps_fix = 3
min_battery_pct = 40
pilot_override_detection = true
pilot_override_hold_s = 0       # latched until the operator clears it
# Optional radio "LLM inhibit" switch, e.g. RC8 high = LLM locked out:
llm_inhibit_rc_channel = 0
llm_inhibit_pwm_above = 1800
min_action_interval_s = 1.5
max_actions_per_minute = 12

[safety.param_allowlist]        # name = [min, max]; everything else refused
# ArduCopter <= 4.6 names (cm, cm/s) - what a Pixhawk 1 usually runs
WPNAV_SPEED = [50.0, 300.0]
WPNAV_SPEED_UP = [50.0, 150.0]
WPNAV_SPEED_DN = [30.0, 100.0]
LOIT_SPEED = [50.0, 300.0]
RTL_ALT = [500.0, 2000.0]
LAND_SPEED = [30.0, 60.0]
# ArduCopter >= 4.7 names (m, m/s)
WP_SPD = [0.5, 3.0]
WP_SPD_UP = [0.5, 1.5]
WP_SPD_DN = [0.3, 1.0]
LOIT_SPEED_MS = [0.5, 3.0]
RTL_ALT_M = [5.0, 20.0]
LAND_SPD_MS = [0.3, 0.6]

[server]
transport = "streamable-http"
host = "127.0.0.1"
port = 8765
log_dir = "logs/llm-stack"
