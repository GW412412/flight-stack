# mavlink-router configuration for the precision-drone-spraying ground station.
# Runs on the CPU-only computer:  mavlink-routerd -c config/mavlink-router.conf
# Source of truth for the design: docs/DECISIONS.md, docs/ARCHITECTURE.md.
# Syntax: https://github.com/mavlink-router/mavlink-router/blob/master/examples/config.sample
#
# Replace the two placeholder addresses before use:
#   192.168.122.100  Mission Planner VM
#   192.168.1.50     GPU computer (watchers, d1-omni)
#
# Filters: *Out = what the endpoint is sent. *In = what it is allowed to send.
# An empty or missing filter allows everything.
# Message IDs: 0 HEARTBEAT, 1 SYS_STATUS, 2 SYSTEM_TIME, 22 PARAM_VALUE,
# 24 GPS_RAW_INT, 30 ATTITUDE, 33 GLOBAL_POSITION_INT, 36 SERVO_OUTPUT_RAW,
# 39 MISSION_ITEM, 40 MISSION_REQUEST, 42 MISSION_CURRENT, 44 MISSION_COUNT,
# 46 MISSION_ITEM_REACHED, 47 MISSION_ACK, 51 MISSION_REQUEST_INT,
# 62 NAV_CONTROLLER_OUTPUT, 65 RC_CHANNELS, 73 MISSION_ITEM_INT, 74 VFR_HUD,
# 77 COMMAND_ACK, 125 POWER_STATUS, 132 DISTANCE_SENSOR, 147 BATTERY_STATUS,
# 148 AUTOPILOT_VERSION, 162 FENCE_STATUS, 173 RANGEFINDER,
# 193 EKF_STATUS_REPORT, 241 VIBRATION, 242 HOME_POSITION, 253 STATUSTEXT.

[General]
# The default TCP server on 5760 listens on every interface. Not needed here.
TcpServerPort = 0
MavlinkDialect = ardupilotmega
# Full logging: flight-stack log plus raw telemetry (.tlog), which records the
# source system and component of every message, so it shows who said what.
# Create the directory and make it writable first.
Log = /var/log/mavlink-router
LogTelemetry = true
LogMode = always

# ---------------------------------------------------------------------------
# Flight controller (Cube, USB). Telemetry in, commands out. No filter.
# ---------------------------------------------------------------------------
[UartEndpoint fc]
Device = /dev/ttyACM0
Baud = 57600

# ---------------------------------------------------------------------------
# Full ground stations. They set up, tune and calibrate, so they need the
# whole stream and may send anything.
# ---------------------------------------------------------------------------

# QGroundControl, listening on its default UDP port.
# BlockMsgIdIn = 0 stops QGC's heartbeat reaching the Cube, so QGC being open
# cannot keep the GCS failsafe timer alive. From the stack report, untested.
[UdpEndpoint qgc]
Mode = Normal
Address = 127.0.0.1
Port = 14550
BlockMsgIdIn = 0

# Mission Planner in the VM, listening on its default UDP port.
[UdpEndpoint missionplanner_vm]
Mode = Normal
Address = 192.168.122.100
Port = 14550

# ---------------------------------------------------------------------------
# mavproxy, terminal console. Shows telemetry and injects flight modes.
# Connect with: mavproxy.py --master=udpin:127.0.0.1:14552
# Out: console telemetry plus replies to its own requests (params, missions,
# commands). In: unfiltered, because it must send mode changes and commands.
# ---------------------------------------------------------------------------
[UdpEndpoint mavproxy]
Mode = Normal
Address = 127.0.0.1
Port = 14552
AllowMsgIdOut = 0,1,2,22,24,30,33,36,39,40,42,44,46,47,51,62,65,73,74,77,125,147,148,193,241,242,253

# ---------------------------------------------------------------------------
# Conversation model: mavlink-mcp listening on UDP 14560 (stack report).
# Unfiltered both ways. It is the one place advisory input becomes action.
# ---------------------------------------------------------------------------
[UdpEndpoint conversation_model]
Mode = Normal
Address = 127.0.0.1
Port = 14560

# ---------------------------------------------------------------------------
# Watchers and d1-omni, on the GPU computer. Advisory only, so read-only:
# they get a short list of telemetry and may send only STATUSTEXT (253),
# never commands. One section per watcher, each with just what it needs.
# Add a section, a port and an ID list when a new watcher is added.
# Give each watcher its own MAVLink source system ID so logs identify it.
# ---------------------------------------------------------------------------

# Orientation, position, height and mode: tilt and run-off watchers.
[UdpEndpoint watcher_flight]
Mode = Normal
Address = 192.168.1.50
Port = 14570
AllowMsgIdOut = 0,24,30,33,42,74,132,173,253
AllowMsgIdIn = 253

# Battery, power and sensor health.
[UdpEndpoint watcher_power]
Mode = Normal
Address = 192.168.1.50
Port = 14571
AllowMsgIdOut = 0,1,125,147,193,241,253
AllowMsgIdIn = 253

# d1-omni: state summary for go/no-go calls.
[UdpEndpoint d1omni]
Mode = Normal
Address = 192.168.1.50
Port = 14572
AllowMsgIdOut = 0,1,24,30,33,42,74,147,193,253
AllowMsgIdIn = 253
