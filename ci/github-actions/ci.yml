# Hardware-free CI for flight-stack.
#
# Added by Maya (AI agent, Sesame) at G's request, 2026-10-27, after the
# Manus / DeepSeek repository reviews (see the review-record discussion).
#
# What it does: installs drone_stack/middleware/requirements.txt, byte-compiles
# the middleware and scripts, and runs the offline pytest suite. That suite uses
# unit logic, synthetic map/vision data, the in-process fake vehicle over local
# UDP and an in-memory MCP session. No aircraft, camera, radio, pump, SITL
# binary or network service is involved.
#
# What it does NOT do: it does not test flight behaviour, it does not approve
# anything for flight, and it changes no code, config or runtime behaviour.
# A green run means "the offline tests pass", nothing more.
#
# Ruff runs in report-only mode (continue-on-error) with a narrow rule set
# (syntax errors and pyflakes). It never fails the build.

name: ci (hardware-free)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: compile + offline pytest (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: drone_stack/middleware/requirements.txt

      - name: Install middleware requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r drone_stack/middleware/requirements.txt
          pip freeze > pip-freeze.txt

      - name: Byte-compile middleware and scripts
        run: python -m compileall -q drone_stack/middleware scripts

      - name: Offline test suite
        run: python -m pytest -q -p no:cacheprovider drone_stack/middleware/tests

      - name: Ruff (report only, never fails the build)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check --select E9,F --output-format=github drone_stack/middleware scripts

      - name: Keep the exact package versions this run used
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-freeze
          path: pip-freeze.txt
